<!DOCTYPE html>
<html lang="tr">
<head>
  <script src="../assets/js/canonical-host.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Öğrenci Girişi — Sürücü Akademisi</title>
  <link rel="stylesheet" href="../assets/css/site.css?v=20260728-premium-tenant-select-web-2" />
</head>
<body class="page-auth page-app-login">
  <header class="app-login-header">
    <div class="app-login-header__inner">
      <div class="app-login-brand">
        <img class="app-login-brand__logo" src="../assets/images/logo.png" width="168" height="168" alt="" />
        <div class="app-login-brand__text">
          <p class="app-login-brand__name">Sürücü Akademisi</p>
          <p class="app-login-brand__portal">Sürücü Kursları Öğrenci Web Paneli</p>
          <p class="app-login-brand__tagline">Kurumunuzun güvenli öğrenci giriş kapısı</p>
        </div>
      </div>
      <a class="app-login-home-pill" href="../index.html">Ana sayfa</a>
    </div>
  </header>

  <main class="auth-main app-login-main">
    <div class="auth-wrap app-login-wrap">
      <article class="login-card app-login-card">
        <div class="app-login-card__hero">
          <h1>Öğrenci Girişi</h1>
          <p class="login-sub">Kurumunuzu seçin, kullanıcı adınız ve şifrenizle giriş yapın.</p>
        </div>

        <form id="login-form" class="app-login-form" novalidate>
          <div class="auth-step app-login-step">
            <span class="auth-step-label">1. Kurum seç</span>
            <label class="field-label" id="login-tenant-label" for="login-tenant">Kurum</label>
            <div class="tenant-select" id="tenant-select">
              <select class="field-select app-login-field" id="login-tenant" disabled aria-disabled="true" required aria-labelledby="login-tenant-label">
                <option value="">Kurum seçin</option>
              </select>
              <button
                type="button"
                class="tenant-select__trigger"
                id="tenant-select-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="tenant-select-listbox"
                aria-labelledby="login-tenant-label tenant-select-trigger-label"
                disabled
              >
                <span class="tenant-select__trigger-label" id="tenant-select-trigger-label">Kurumlar yükleniyor…</span>
                <span class="tenant-select__trigger-chevron" aria-hidden="true"></span>
              </button>
              <div class="tenant-select__popover" id="tenant-select-popover" hidden>
                <div class="tenant-select-search">
                  <span class="tenant-select-search__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75" />
                      <path d="M16.2 16.2L20 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                    </svg>
                  </span>
                  <input
                    type="search"
                    class="tenant-select-search__input"
                    id="tenant-select-search-desktop"
                    placeholder="Kurum ara..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Kurum ara"
                    disabled
                  />
                  <button
                    type="button"
                    class="tenant-select-search__clear"
                    id="tenant-select-search-clear-desktop"
                    aria-label="Aramayı temizle"
                    hidden
                  >
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" />
                    </svg>
                  </button>
                </div>
                <div
                  class="tenant-select__listbox"
                  id="tenant-select-listbox"
                  role="listbox"
                  aria-labelledby="login-tenant-label"
                ></div>
                <p class="tenant-select-search-status" id="tenant-select-search-status" aria-live="polite"></p>
              </div>
            </div>
            <p class="tenant-load-status" id="tenant-load-status" aria-live="polite"></p>
          </div>

          <div class="auth-step app-login-step">
            <span class="auth-step-label">2. Kullanıcı bilgileri</span>
            <label class="field-label" for="login-username">Kullanıcı adı</label>
            <input class="field-input app-login-field" type="text" id="login-username" name="username" autocomplete="username" placeholder="Kullanıcı adınız" required />

            <label class="field-label field-label-spaced" for="login-password">Şifre</label>
            <input class="field-input app-login-field" type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Şifreniz" required />
          </div>

          <div class="auth-step app-login-step app-login-step--submit">
            <span class="auth-step-label">3. Giriş</span>
            <button type="submit" class="btn btn-primary btn-block app-login-submit" id="login-submit">Giriş Yap</button>
            <p class="auth-msg app-login-msg" id="login-msg" role="status" aria-live="polite"></p>
          </div>
        </form>
      </article>

      <nav class="auth-backlinks app-login-backlinks" aria-label="Diğer bağlantılar">
        <a class="app-login-backlink" href="../index.html">Ana sayfaya dön</a>
        <a class="app-login-backlink" href="../panel/">Panel girişine dön</a>
      </nav>
    </div>
  </main>

  <div class="tenant-select-backdrop" id="tenant-select-backdrop" hidden></div>
  <div
    class="tenant-select-sheet"
    id="tenant-select-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tenant-select-sheet-title"
    hidden
  >
    <div class="tenant-select-sheet__handle" aria-hidden="true"></div>
    <div class="tenant-select-sheet__header">
      <h2 class="tenant-select-sheet__title" id="tenant-select-sheet-title">Kurumunuzu seçin</h2>
      <button type="button" class="tenant-select-sheet__close" id="tenant-select-sheet-close" aria-label="Kurum seçimini kapat">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="tenant-select-search tenant-select-search--sheet">
      <span class="tenant-select-search__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75" />
          <path d="M16.2 16.2L20 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
      </span>
      <input
        type="search"
        class="tenant-select-search__input"
        id="tenant-select-search-mobile"
        placeholder="Kurum ara..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Kurum ara"
        enterkeyhint="search"
        disabled
      />
      <button
        type="button"
        class="tenant-select-search__clear"
        id="tenant-select-search-clear-mobile"
        aria-label="Aramayı temizle"
        hidden
      >
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div
      class="tenant-select__listbox tenant-select__listbox--sheet"
      id="tenant-select-sheet-listbox"
      role="listbox"
      aria-labelledby="tenant-select-sheet-title"
    ></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../assets/js/web-firebase.js"></script>
  <script src="../assets/js/web-session.js"></script>
  <script src="../assets/js/web-tenant-brand.js"></script>
  <script src="../assets/js/web-tenant-select.js?v=20260728-premium-tenant-select-web-3"></script>
  <script src="../assets/js/web-login.js?v=20260728-premium-tenant-select-web-2"></script>
</body>
</html>
