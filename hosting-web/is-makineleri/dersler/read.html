<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Ders Okuyucu — İş Makineleri | Sürücü Akademisi</title>
  <style>
    :root {
      --ml-bg-0: #020617;
      --ml-bg-1: #0b1224;
      --ml-gold: #fbbf24;
      --ml-program-orange: #fb923c;
      --ml-text: #f8fafc;
      --ml-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: 100svh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ml-text);
      background:
        radial-gradient(1000px 480px at 50% -8%, rgba(251, 191, 36, 0.12), transparent 55%),
        radial-gradient(800px 360px at 100% 10%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, var(--ml-bg-0), var(--ml-bg-1));
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #machine-web-lessons {
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(20px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
    }

    .machine-web-lessons-header {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .machine-web-lessons-home {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      background: rgba(15, 23, 42, 0.85);
      color: #e0f2fe;
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .machine-web-lessons-logout {
      appearance: none;
      border: 1px solid rgba(251, 191, 36, 0.4);
      background: rgba(15, 23, 42, 0.85);
      color: #fef3c7;
      border-radius: 10px;
      min-height: 40px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .machine-web-lessons-main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .machine-web-lessons-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 2px 8px 8px;
    }

    .machine-web-lessons-logo-wrap {
      width: clamp(80px, 12vh, 120px);
      height: clamp(80px, 12vh, 120px);
      max-width: min(120px, 40vw);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #machine-web-lessons-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #machine-web-lessons-monogram {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(145deg, #f5c518, #eab308);
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    #machine-web-lessons-logo[hidden],
    #machine-web-lessons-monogram[hidden] {
      display: none !important;
    }

    #machine-web-lessons-institution-name {
      margin: 0 0 4px;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      font-weight: 800;
      color: #fbbf24;
    }

    #machine-web-lessons-brand-name {
      margin: 0 0 4px;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 800;
      color: #e2e8f0;
    }

    #machine-web-lessons-program-title {
      margin: 0;
      font-size: clamp(0.88rem, 2vw, 1.05rem);
      font-weight: 800;
      line-height: 1.3;
    }

    .machine-web-lessons-hero[data-brand-mode="public"] #machine-web-lessons-program-title {
      color: var(--ml-gold);
    }

    .machine-web-lessons-hero[data-brand-mode="institution"] #machine-web-lessons-program-title {
      color: var(--ml-program-orange);
    }

    .machine-web-lessons-nav {
      margin: 4px 0 12px;
      font-size: 0.88rem;
      color: var(--ml-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .machine-web-lessons-nav a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 600;
    }

    .machine-web-lessons-nav a:hover {
      text-decoration: underline;
    }

    .machine-web-lessons-nav__sep {
      opacity: 0.55;
    }

    .machine-web-lessons-page-title {
      margin: 4px 0 8px;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.35;
    }

    .machine-web-lessons-intro {
      margin: 0 0 16px;
      color: var(--ml-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .machine-web-lessons-status {
      margin: 0 0 12px;
      color: var(--ml-muted);
      font-size: 0.9rem;
    }

    .machine-web-lessons-status.is-error {
      color: #fecaca;
    }

    .machine-web-lessons-empty {
      margin: 0;
      color: var(--ml-muted);
      font-size: 0.95rem;
    }

    .machine-web-lessons-blocks {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    .ml-block {
      padding: 18px 20px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 28, 49, 0.72);
    }

    .ml-block--preset-info {
      border-color: rgba(34, 211, 238, 0.35);
      background: rgba(8, 47, 73, 0.45);
    }

    .ml-block--preset-warning {
      border-color: rgba(251, 191, 36, 0.35);
      background: rgba(69, 45, 8, 0.35);
    }

    .ml-block--preset-danger {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(69, 10, 10, 0.35);
    }

    .ml-text-body {
      font-size: 1rem;
      line-height: 1.65;
      color: #e2e8f0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .ml-text-body--segments {
      white-space: pre-wrap;
    }

    .ml-text-seg--bold { font-weight: 700; }
    .ml-text-seg--italic { font-style: italic; }
    .ml-text-seg--danger { color: #fca5a5; font-weight: 600; }

    .ml-block--image {
      padding: 14px;
    }

    .ml-figure {
      margin: 0;
      text-align: center;
    }

    .ml-image {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: 420px;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 10px;
    }

    .ml-image--inline {
      max-height: 320px;
    }

    .ml-image-caption {
      margin: 10px 0 0;
      font-size: 0.88rem;
      line-height: 1.5;
      color: rgba(203, 213, 225, 0.9);
      text-align: center;
    }

    .ml-block-attached {
      margin-top: 14px;
    }

    .ml-youtube {
      margin: 8px 0 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(34, 211, 238, 0.35);
      background: rgba(8, 47, 73, 0.35);
    }

    .ml-youtube__label {
      margin: 0 0 8px;
      font-size: 0.85rem;
      color: #a5f3fc;
    }

    .ml-youtube__link {
      color: #6ee7b7;
      font-weight: 600;
      text-decoration: none;
    }

    .ml-youtube__link:hover {
      text-decoration: underline;
    }

    .machine-web-lessons-progress {
      margin-top: 22px;
      padding: 18px 16px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 28, 49, 0.78);
      text-align: center;
    }

    .machine-web-lessons-progress--completed {
      border-color: rgba(74, 222, 128, 0.45);
      background: linear-gradient(135deg, rgba(15, 40, 35, 0.9), rgba(15, 28, 49, 0.82));
    }

    .machine-web-lessons-progress__status {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .machine-web-lessons-progress__status--done {
      color: #4ade80;
      font-weight: 700;
    }

    .machine-web-lessons-progress__status--done::before {
      content: "";
    }

    .machine-web-lessons-progress__btn {
      appearance: none;
      min-height: 48px;
      width: min(100%, 320px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(52, 211, 153, 0.55);
      background: linear-gradient(180deg, rgba(6, 78, 59, 0.95), rgba(4, 47, 36, 0.98));
      color: #ecfdf5;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(52, 211, 153, 0.28);
    }

    .machine-web-lessons-progress__btn:hover:not(:disabled) {
      border-color: rgba(52, 211, 153, 0.8);
      box-shadow: 0 0 28px rgba(52, 211, 153, 0.4);
    }

    .machine-web-lessons-progress__btn:disabled {
      cursor: default;
      opacity: 0.92;
    }

    .machine-web-lessons-progress__btn--completed {
      border-color: rgba(74, 222, 128, 0.55);
      background: linear-gradient(180deg, rgba(20, 83, 45, 0.95), rgba(6, 40, 22, 0.98));
      color: #bbf7d0;
    }

    .machine-web-lessons-progress__btn--completed::before {
      content: "✓ ";
    }

    .machine-web-lessons-progress__btn--saving {
      opacity: 0.75;
    }

    .machine-web-lessons-progress__message {
      margin: 12px 0 0;
      font-size: 0.86rem;
      color: #a7f3d0;
    }

    .machine-web-lessons-progress__message--error {
      color: #fecaca;
    }

    .machine-web-lessons-back {
      margin: 22px 0 8px;
      font-size: 0.9rem;
    }

    .machine-web-lessons-back a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 600;
    }

    .machine-web-lessons-back a:hover {
      text-decoration: underline;
    }

    #machine-web-lessons-gate {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ml-muted);
      font-size: 0.95rem;
    }

    #machine-web-lessons-gate[hidden] {
      display: none !important;
    }

    @media (max-width: 560px) {
      .ml-block {
        padding: 14px 14px;
      }

      .machine-web-lessons-progress__btn {
        width: 100%;
      }
    }
  </style>
</head>
<body data-ml-page="read">
  <div id="machine-web-lessons" hidden>
    <header class="machine-web-lessons-header">
      <a class="machine-web-lessons-home" id="machine-web-lessons-home" href="../">Ana Sayfa</a>
      <button type="button" class="machine-web-lessons-logout" id="machine-web-lessons-logout">Çıkış</button>
    </header>

    <main class="machine-web-lessons-main">
      <section class="machine-web-lessons-hero" aria-label="İş Makineleri program başlığı">
        <div class="machine-web-lessons-logo-wrap">
          <img id="machine-web-lessons-logo" alt="" hidden />
          <div id="machine-web-lessons-monogram" hidden>S</div>
        </div>
        <h1 id="machine-web-lessons-institution-name" hidden></h1>
        <p id="machine-web-lessons-brand-name">Sürücü Akademisi</p>
        <p id="machine-web-lessons-program-title">İş Makineleri Operatörlük Sınavlarına Hazırlık</p>
      </section>

      <nav class="machine-web-lessons-nav" aria-label="Sayfa yolu">
        <a href="./">Dersler</a>
        <span class="machine-web-lessons-nav__sep" aria-hidden="true">›</span>
        <a id="machine-web-lessons-crumb-category" href="./units.html">Ders</a>
      </nav>

      <h2 class="machine-web-lessons-page-title" id="machine-web-lessons-reader-title">Ders Okuyucu</h2>
      <p class="machine-web-lessons-intro">
        Konu anlatım metinleri ve görselleri aşağıda sırayla gösterilir.
      </p>

      <p id="machine-web-lessons-reader-loading" class="machine-web-lessons-status" hidden>İçerik yükleniyor…</p>
      <p id="machine-web-lessons-reader-error" class="machine-web-lessons-status is-error" hidden role="alert"></p>

      <div id="machine-web-lessons-youtube" hidden></div>

      <div
        id="machine-web-lessons-blocks"
        class="machine-web-lessons-blocks"
        hidden
        aria-live="polite"
      ></div>

      <aside
        id="machine-web-lessons-progress"
        class="machine-web-lessons-progress"
        hidden
        aria-label="Ders tamamlama"
      >
        <p id="machine-web-lessons-progress-status" class="machine-web-lessons-progress__status"></p>
        <button
          type="button"
          id="machine-web-lessons-progress-action"
          class="machine-web-lessons-progress__btn"
          hidden
        >
          Tamamlandı olarak işaretle
        </button>
        <p
          id="machine-web-lessons-progress-message"
          class="machine-web-lessons-progress__message"
          hidden
          role="status"
          aria-live="polite"
        ></p>
      </aside>

      <p class="machine-web-lessons-back">
        <a id="machine-web-lessons-back-units" href="./units.html">Ünite listesine dön</a>
      </p>
    </main>
  </div>

  <div id="machine-web-lessons-gate">Oturum doğrulanıyor…</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <script src="../../assets/js/web-firebase.js"></script>
  <script src="../../assets/js/machine-web-session.js"></script>
  <script src="../../assets/js/machine-web-lessons.js"></script>
</body>
</html>
