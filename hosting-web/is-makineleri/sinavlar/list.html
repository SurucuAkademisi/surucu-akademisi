<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sınav Listesi — İş Makineleri | Sürücü Akademisi</title>
  <style>
    :root {
      --me-bg-0: #020617;
      --me-bg-1: #0b1224;
      --me-gold: #fbbf24;
      --me-program-orange: #fb923c;
      --me-text: #f8fafc;
      --me-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%; min-height: 100svh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--me-text);
      background:
        radial-gradient(1000px 480px at 50% -8%, rgba(251, 191, 36, 0.12), transparent 55%),
        radial-gradient(800px 360px at 100% 10%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, var(--me-bg-0), var(--me-bg-1));
    }
    body { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #machine-web-exams {
      width: 100%; min-height: 100svh; min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    .machine-web-exams-header {
      width: 100%; max-width: 960px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .machine-web-exams-home {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 8px 14px; border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.45); background: rgba(15, 23, 42, 0.85);
      color: #e0f2fe; font-size: 0.86rem; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .machine-web-exams-logout {
      appearance: none; border: 1px solid rgba(251, 191, 36, 0.4); background: rgba(15, 23, 42, 0.85);
      color: #fef3c7; border-radius: 10px; min-height: 40px; padding: 8px 14px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer;
    }
    .machine-web-exams-main { width: 100%; max-width: 960px; margin: 0 auto; }
    .machine-web-exams-hero {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      width: 100%; padding: 4px 8px 12px;
    }
    .machine-web-exams-logo-wrap {
      width: clamp(96px, 14vh, 132px); height: clamp(96px, 14vh, 132px);
      max-width: min(132px, 48vw); margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
    }
    #machine-web-exams-logo { width: 100%; height: 100%; object-fit: contain; display: block; }
    #machine-web-exams-monogram {
      width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.8rem, 6vw, 2.4rem); font-weight: 800; color: #0f172a;
      background: linear-gradient(145deg, #f5c518, #eab308); border: 1px solid rgba(251, 191, 36, 0.5);
    }
    #machine-web-exams-logo[hidden], #machine-web-exams-monogram[hidden] { display: none !important; }
    #machine-web-exams-institution-name { margin: 0 0 6px; font-size: clamp(1.1rem, 2.8vw, 1.35rem); font-weight: 800; color: #fbbf24; }
    #machine-web-exams-brand-name { margin: 0 0 6px; font-size: clamp(1rem, 2.4vw, 1.2rem); font-weight: 800; color: #e2e8f0; }
    #machine-web-exams-program-title { margin: 0; font-size: clamp(0.92rem, 2.1vw, 1.08rem); font-weight: 800; line-height: 1.3; }
    .machine-web-exams-hero[data-brand-mode="public"] #machine-web-exams-program-title { color: var(--me-gold); }
    .machine-web-exams-hero[data-brand-mode="institution"] #machine-web-exams-program-title { color: var(--me-program-orange); }
    .machine-web-exams-page-title { margin: 8px 0 6px; text-align: center; font-size: clamp(1.25rem, 3vw, 1.55rem); font-weight: 800; }
    .machine-web-exams-status { margin: 0 auto 14px; text-align: center; color: var(--me-muted); font-size: 0.9rem; }
    .machine-web-exams-error { margin: 0 auto 14px; text-align: center; color: #fca5a5; font-size: 0.92rem; }
    .machine-web-exams-back {
      margin: 18px 0 0; text-align: center;
    }
    .machine-web-exams-back a {
      color: #93c5fd; font-weight: 700; text-decoration: none; font-size: 0.92rem;
    }
    .machine-web-exams-back a:hover { color: #e0f2fe; text-decoration: underline; }
    .machine-web-exams-list-root {
      display: grid; grid-template-columns: 1fr; gap: 14px; width: 100%; margin-top: 8px;
    }
    .machine-web-exams-pub-card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
      padding: 18px 18px 16px; border-radius: 16px;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      background:
        radial-gradient(ellipse 120% 80% at 100% -10%, rgba(56, 189, 248, 0.16), transparent 52%),
        linear-gradient(158deg, rgba(12, 24, 46, 0.94) 0%, rgba(8, 16, 32, 0.88) 48%, rgba(5, 10, 22, 0.92) 100%);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.16), 0 10px 28px rgba(2, 8, 23, 0.5);
    }
    .machine-web-exams-pub-card__head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .machine-web-exams-pub-card__title { margin: 0; font-size: 1.08rem; font-weight: 800; color: #f8fafc; }
    .machine-web-exams-pub-card__status {
      flex-shrink: 0; padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.45); background: rgba(6, 78, 59, 0.35);
      color: #a7f3d0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase;
    }
    .machine-web-exams-pub-card__meta { margin: 0; font-size: 0.86rem; color: #93c5fd; font-weight: 600; }
    .machine-web-exams-pub-card__desc { margin: 0; font-size: 0.9rem; line-height: 1.5; color: rgba(226, 232, 240, 0.88); }
    .machine-web-exams-pub-card__actions { margin-top: 6px; }
    .machine-web-exams-pub-card__btn {
      appearance: none; min-height: 44px; padding: 8px 16px; border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.55);
      background: linear-gradient(180deg, rgba(14, 116, 144, 0.55), rgba(8, 47, 73, 0.85));
      color: #e0f2fe; font-size: 0.9rem; font-weight: 800; cursor: pointer;
    }
    .machine-web-exams-pub-card__btn:hover,
    .machine-web-exams-pub-card__btn:focus-visible {
      outline: none; border-color: rgba(125, 211, 252, 0.85); color: #f0f9ff;
    }
    #machine-web-exams-gate {
      min-height: 40vh; display: flex; align-items: center; justify-content: center; color: var(--me-muted); font-size: 0.95rem;
    }
    #machine-web-exams-gate[hidden] { display: none !important; }
    @media (max-width: 560px) {
      .machine-web-exams-pub-card__head { flex-direction: column; align-items: flex-start; }
      .machine-web-exams-pub-card__btn { width: 100%; }
    }
  </style>
</head>
<body data-me-page="list">
  <div id="machine-web-exams" hidden>
    <header class="machine-web-exams-header">
      <a class="machine-web-exams-home" id="machine-web-exams-home" href="../">Ana Sayfa</a>
      <button type="button" class="machine-web-exams-logout" id="machine-web-exams-logout">Çıkış</button>
    </header>
    <main class="machine-web-exams-main">
      <section class="machine-web-exams-hero" aria-label="İş Makineleri program başlığı">
        <div class="machine-web-exams-logo-wrap">
          <img id="machine-web-exams-logo" alt="" hidden />
          <div id="machine-web-exams-monogram" hidden>S</div>
        </div>
        <h1 id="machine-web-exams-institution-name" hidden></h1>
        <p id="machine-web-exams-brand-name">Sürücü Akademisi</p>
        <p id="machine-web-exams-program-title">İş Makineleri Operatörlük Sınavlarına Hazırlık</p>
      </section>
      <h2 class="machine-web-exams-page-title" id="machine-web-exams-list-title">Sınavlar</h2>
      <p id="machine-web-exams-list-loading" class="machine-web-exams-status" hidden>Sınavlar yükleniyor…</p>
      <p id="machine-web-exams-list-error" class="machine-web-exams-error" hidden role="alert"></p>
      <p id="machine-web-exams-list-empty" class="machine-web-exams-status" hidden role="status"></p>
      <div id="machine-web-exams-list-root" class="machine-web-exams-list-root" aria-label="Sınav listesi"></div>
      <p class="machine-web-exams-back">
        <a id="machine-web-exams-back-hub" href="./">← Tüm kategorilere dön</a>
      </p>
    </main>
  </div>
  <div id="machine-web-exams-gate">Oturum doğrulanıyor…</div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <script src="../../assets/js/web-firebase.js"></script>
  <script src="../../assets/js/machine-web-session.js"></script>
  <script src="../../assets/js/machine-web-exam-attempts.js"></script>
  <script src="../../assets/js/machine-web-exams.js"></script>
</body>
</html>
