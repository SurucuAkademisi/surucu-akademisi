<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Video Dersler — İş Makineleri | Sürücü Akademisi</title>
  <style>
    :root {
      --mv-bg-0: #020617;
      --mv-bg-1: #0b1224;
      --mv-gold: #fbbf24;
      --mv-program-orange: #fb923c;
      --mv-text: #f8fafc;
      --mv-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: 100svh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--mv-text);
      background:
        radial-gradient(1000px 480px at 50% -8%, rgba(251, 191, 36, 0.12), transparent 55%),
        radial-gradient(800px 360px at 100% 10%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, var(--mv-bg-0), var(--mv-bg-1));
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #machine-web-videos {
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(20px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
    }

    .machine-web-videos-header {
      width: 100%;
      max-width: 960px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .machine-web-videos-home {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      background: rgba(15, 23, 42, 0.85);
      color: #e0f2fe;
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .machine-web-videos-logout {
      appearance: none;
      border: 1px solid rgba(251, 191, 36, 0.4);
      background: rgba(15, 23, 42, 0.85);
      color: #fef3c7;
      border-radius: 10px;
      min-height: 40px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .machine-web-videos-main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    .machine-web-videos-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 4px 8px 12px;
    }

    .machine-web-videos-logo-wrap {
      width: clamp(112px, 18vh, 160px);
      height: clamp(112px, 18vh, 160px);
      max-width: min(160px, 56vw);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #machine-web-videos-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #machine-web-videos-monogram {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(145deg, #f5c518, #eab308);
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    #machine-web-videos-logo[hidden],
    #machine-web-videos-monogram[hidden] {
      display: none !important;
    }

    #machine-web-videos-institution-name {
      margin: 0 0 6px;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 800;
      color: #fbbf24;
      line-height: 1.2;
    }

    #machine-web-videos-brand-name {
      margin: 0 0 6px;
      font-size: clamp(1.1rem, 2.6vw, 1.3rem);
      font-weight: 800;
      color: #e2e8f0;
    }

    #machine-web-videos-program-title {
      margin: 0;
      font-size: clamp(0.98rem, 2.3vw, 1.18rem);
      font-weight: 800;
      line-height: 1.3;
    }

    .machine-web-videos-hero[data-brand-mode="public"] #machine-web-videos-program-title {
      color: var(--mv-gold);
    }

    .machine-web-videos-hero[data-brand-mode="institution"] #machine-web-videos-program-title {
      color: var(--mv-program-orange);
    }

    .machine-web-videos-page-title {
      margin: 8px 0 6px;
      text-align: center;
      font-size: clamp(1.35rem, 3.2vw, 1.7rem);
      font-weight: 800;
    }

    .machine-web-videos-intro {
      margin: 0 auto 18px;
      max-width: none;
      width: 100%;
      text-align: center;
      color: var(--mv-muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .machine-web-videos-status {
      margin: 0 auto 14px;
      text-align: center;
      color: var(--mv-muted);
      font-size: 0.9rem;
    }

    .machine-web-videos-category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 320px));
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      width: 100%;
    }

    .machine-web-videos-book-card {
      --hub-card-accent-rgb: 251, 191, 36;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 236px;
      padding: 20px 18px 86px;
      border-radius: 16px;
      border: 1.5px solid rgba(var(--hub-card-accent-rgb), 0.55);
      background:
        radial-gradient(ellipse 120% 80% at 100% -10%, rgba(var(--hub-card-accent-rgb), 0.22), transparent 52%),
        radial-gradient(ellipse 70% 50% at 0% 100%, rgba(var(--hub-card-accent-rgb), 0.08), transparent 48%),
        linear-gradient(158deg, rgba(12, 24, 46, 0.94) 0%, rgba(8, 16, 32, 0.88) 48%, rgba(5, 10, 22, 0.92) 100%);
      box-shadow:
        0 0 0 1px rgba(var(--hub-card-accent-rgb), 0.12) inset,
        0 0 36px rgba(var(--hub-card-accent-rgb), 0.22),
        0 10px 32px rgba(2, 8, 23, 0.55);
      transition: border-color 0.24s ease, box-shadow 0.24s ease, transform 0.24s ease;
      user-select: none;
    }

    .machine-web-videos-book-card::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto auto;
      width: 72%;
      height: 72%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--hub-card-accent-rgb), 0.42) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    .machine-web-videos-book-card--gold { --hub-card-accent-rgb: 251, 191, 36; }
    .machine-web-videos-book-card--green { --hub-card-accent-rgb: 52, 211, 153; }
    .machine-web-videos-book-card--clickable { cursor: pointer; }

    .machine-web-videos-book-card--clickable:hover,
    .machine-web-videos-book-card--clickable:focus-visible {
      outline: none;
      transform: translateY(-4px);
      border-color: rgba(var(--hub-card-accent-rgb), 0.78);
      box-shadow:
        0 0 0 1px rgba(var(--hub-card-accent-rgb), 0.2) inset,
        0 0 52px rgba(var(--hub-card-accent-rgb), 0.42),
        0 16px 44px rgba(2, 8, 23, 0.62);
    }

    .machine-web-videos-book-card__title,
    .machine-web-videos-book-card__desc {
      position: relative;
      z-index: 1;
    }

    .machine-web-videos-book-card__title {
      margin: 0 0 10px;
      font-weight: 800;
      font-size: 1.16rem;
      color: #f8fafc;
      text-shadow: 0 0 22px rgba(var(--hub-card-accent-rgb), 0.55);
    }

    .machine-web-videos-book-card__desc {
      flex: 1;
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.55;
      color: rgba(236, 242, 255, 0.9);
    }

    .machine-web-videos-book-card__cta {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(220px, calc(100% - 72px));
      min-height: 28px;
      padding: 5px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      border: 1px solid rgba(var(--hub-card-accent-rgb), 0.52);
      background: linear-gradient(180deg, rgba(10, 18, 36, 0.88), rgba(6, 12, 26, 0.92));
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.69rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
    }

    #machine-web-videos-gate {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mv-muted);
      font-size: 0.95rem;
    }

    #machine-web-videos-gate[hidden] {
      display: none !important;
    }

    @media (min-width: 721px) {
      .machine-web-videos-intro {
        white-space: nowrap;
      }
    }

    @media (max-width: 720px) {
      .machine-web-videos-intro {
        white-space: normal;
      }
    }

    @media (max-width: 700px) {
      .machine-web-videos-category-grid {
        grid-template-columns: minmax(0, 320px);
        justify-content: center;
      }
    }
  </style>
</head>
<body data-mv-page="hub">
  <div id="machine-web-videos" hidden>
    <header class="machine-web-videos-header">
      <a class="machine-web-videos-home" id="machine-web-videos-home" href="../">Ana Sayfa</a>
      <button type="button" class="machine-web-videos-logout" id="machine-web-videos-logout">Çıkış</button>
    </header>

    <main class="machine-web-videos-main">
      <section class="machine-web-videos-hero" aria-label="İş Makineleri program başlığı">
        <div class="machine-web-videos-logo-wrap">
          <img id="machine-web-videos-logo" alt="" hidden />
          <div id="machine-web-videos-monogram" hidden>S</div>
        </div>
        <h1 id="machine-web-videos-institution-name" hidden></h1>
        <p id="machine-web-videos-brand-name">Sürücü Akademisi</p>
        <p id="machine-web-videos-program-title">İş Makineleri Operatörlük Sınavlarına Hazırlık</p>
      </section>

      <h2 class="machine-web-videos-page-title">Video Dersler</h2>
      <p class="machine-web-videos-intro">
        İş Makineleri ve İlk Yardım öğretmen anlatımlı video dersleri. Bir kategori seçerek videoları görüntüleyin.
      </p>

      <p id="machine-web-videos-hub-loading" class="machine-web-videos-status" hidden>Videolar hazırlanıyor…</p>

      <section
        id="machine-web-videos-category-grid"
        class="machine-web-videos-category-grid"
        aria-label="Video kategorileri"
        hidden
      ></section>
    </main>
  </div>

  <div id="machine-web-videos-gate">Oturum doğrulanıyor…</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <script src="../../assets/js/web-firebase.js"></script>
  <script src="../../assets/js/machine-web-session.js"></script>
  <script src="../../assets/js/machine-web-videos.js"></script>
</body>
</html>
