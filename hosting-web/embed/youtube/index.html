<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .err {
      color: #ccc;
      font: 14px/1.4 system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var id = String(params.get('v') || '').trim();
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        document.body.innerHTML = '<div class="err">Video kullanılamıyor.</div>';
        return;
      }
      var src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?playsinline=1&rel=0';
      var iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute(
        'allow',
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'
      );
      iframe.title = 'YouTube video';
      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
